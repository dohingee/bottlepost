# Builds the iOS app for the simulator and runs its unit tests. No signing, no secrets.
# macOS minutes count 10x against the private-repo Actions quota, so this runs only when ios/ changes.
name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - "!ios/fastlane/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/fastlane/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # App Store builds need the iOS 26 SDK. macos-15 images carry Xcode 26 next to older ones
      # (macos-26 jobs were cancelled after 15 minutes in the queue for lack of capacity).
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version | head -1 | grep -qE 'Xcode (2[6-9]|[3-9][0-9])' || { echo "::error::Xcode 26 or newer is required"; exit 1; }

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - uses: actions/cache@v5
        with:
          path: ios/build/spm
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: Build and test (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt in sorted(devices, reverse=True) if ".iOS-" in rt
                     for d in devices[rt] if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Bottlepost.xcodeproj -scheme Bottlepost \
            -destination "id=$udid" \
            -clonedSourcePackagesDirPath build/spm \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../xcodebuild-output.txt | grep -E "error:|warning: .*Bottlepost/|Test Suite|Executed|\*\* " || true
          grep -q '\*\* TEST SUCCEEDED \*\*' ../xcodebuild-output.txt

      - name: Report build errors
        if: failure() && hashFiles('xcodebuild-output.txt') != ''
        run: |
          { grep -E "error:|failed|XCTAssert" xcodebuild-output.txt || tail -n 30 xcodebuild-output.txt; } \
            | tail -n 30 | cut -c1-400 | sed -E 's/%/%25/g' | while IFS= read -r line; do echo "::error title=xcodebuild::${line}"; done
