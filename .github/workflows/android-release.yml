# Builds the signed Play bundle (.aab). Run it manually from the Actions tab, then download the
# "bottlepost-aab" artifact and upload it in Play Console. Setup: docs/RELEASE_GUIDE.md.
name: Android release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          for name in KEYSTORE:UPLOAD_KEYSTORE_BASE64 STORE_PW:UPLOAD_KEYSTORE_PASSWORD KEY_PW:UPLOAD_KEY_PASSWORD SA:FIREBASE_SERVICE_ACCOUNT; do
            var="${name%%:*}"
            if [ -z "${!var}" ]; then echo "::error::GitHub secret ${name#*:} is not set (docs/RELEASE_GUIDE.md)"; missing=1; fi
          done
          if [ -z "$PROJECT" ]; then echo "::error::GitHub variable FIREBASE_PROJECT_ID is not set"; missing=1; fi
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      # google-services.json is not committed; fetch the real one for the registered Android app.
      - name: Fetch google-services.json
        run: |
          set -o pipefail
          npx -y firebase-tools@15 apps:sdkconfig ANDROID --project "${{ vars.FIREBASE_PROJECT_ID }}" --out android/app/google-services.json 2>&1 | tee sdkconfig.txt
          grep -q '"package_name": *"com.bottlepost.app"' android/app/google-services.json

      - name: Restore upload key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Test, lint and bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease 2>&1 | tee ../gradle-output.txt
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee -a ../gradle-output.txt | grep -q "jar verified"
          echo "Built versionCode $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bottlepost-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Logs are hard to reach from some environments; surface the key lines as annotations.
      - name: Report errors
        if: failure()
        run: |
          for f in sdkconfig.txt gradle-output.txt; do
            [ -f "$f" ] && grep -E "^e: |FAILED|error:|Error:|What went wrong" -A3 "$f" | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          done
          true
