# Deploys Cloud Functions, Firestore rules/indexes/TTL and the legal pages.
# Runs on every push to main that touches the backend or legal drafts, or manually from the Actions tab.
name: Firebase deploy

on:
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - "docs/legal/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip silently until the project is configured (docs/FIREBASE_SETUP.md).
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install and test functions
        working-directory: firebase/functions
        run: |
          npm ci
          npm run build
          npm test

      - name: Render legal pages
        run: node firebase/scripts/build-legal.mjs

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Deploy
        working-directory: firebase
        run: |
          set -o pipefail
          npx -y firebase-tools@15 deploy --only functions,firestore,hosting --project "$PROJECT_ID" --non-interactive --force 2>&1 | tee deploy-output.txt

      # Public pages Play Console links to, plus a callable that must reject anonymous calls.
      - name: Smoke test
        run: |
          base="https://${PROJECT_ID}.web.app"
          fail=0
          for path in / /terms /terms-en /privacy /privacy-en /child-safety /delete-account /app-ads.txt /__/firebase/init.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "::notice title=smoke test::$base$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{}}' \
            "https://asia-northeast3-${PROJECT_ID}.cloudfunctions.net/sendLetter")
          echo "::notice title=smoke test::sendLetter without sign-in -> $code (expect 401 or 403)"
          case "$code" in 401|403) ;; *) fail=1 ;; esac
          exit $fail

      # Surface the reason as annotations so it is readable from the run summary and the API.
      - name: Report deploy errors
        if: failure() && hashFiles('firebase/deploy-output.txt') != ''
        working-directory: firebase
        run: |
          { grep -iE "error|failed|denied|permission|not enabled|quota|invalid" deploy-output.txt || tail -n 20 deploy-output.txt; } \
            | grep -v "^\s*$" | tail -n 25 | sed -E 's/%/%25/g' | while IFS= read -r line; do echo "::error title=firebase deploy::${line}"; done
          if [ -f firebase-debug.log ]; then
            grep -iE "error|HTTP Error|status: 4|status: 5" firebase-debug.log | tail -n 15 | cut -c1-400 \
              | while IFS= read -r line; do echo "::error title=firebase-debug.log::${line}"; done
          fi
