# Xcode project definition. The .xcodeproj is generated (never committed):
#   brew install xcodegen && cd ios && xcodegen generate
# CI does the same (.github/workflows/ios-build.yml). Plan: docs/IOS_PLAN.md.
name: Bottlepost
options:
  bundleIdPrefix: com.bottlepost
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # The TestFlight workflow overrides this with the GitHub run number.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # AdMob: Google's test app and ad units until the iOS app is approved in AdMob (then put the real
    # IDs here; tools/policy-check.sh warns while the release build still has test IDs).
    ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
    ADMOB_BANNER: ca-app-pub-3940256099942544/2435281174
    ADMOB_INTERSTITIAL: ca-app-pub-3940256099942544/4411468910
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 3.1.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
targets:
  Bottlepost:
    type: application
    platform: iOS
    sources:
      - path: Bottlepost
        excludes:
          - Info.plist
          - Bottlepost.entitlements
    info:
      path: Bottlepost/Info.plist
      properties:
        CFBundleDisplayName: Bottlepost
        # From the build settings, so the TestFlight workflow's build number (run number) is used.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        # HTTPS and Apple's own crypto only: exempt from export documentation (App Store Connect asks otherwise).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Wake-up for letter pushes, so the letter is already there when the user opens the app.
        UIBackgroundModes: [remote-notification]
        # Ads (Ads/AdsManager.swift). The tracking prompt text is localized in InfoPlist.xcstrings.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        BPAdMobBanner: $(ADMOB_BANNER)
        BPAdMobInterstitial: $(ADMOB_INTERSTITIAL)
        # No NSUserTrackingUsageDescription while ads are off (1.0): App Store Connect refuses a build that
        # can ask for tracking when App Privacy declares none. The release that turns ads on adds it back:
        #   NSUserTrackingUsageDescription: Allows ads that are more relevant to you. Bottlepost never shares your letters.
        # (translations: ios_att_purpose in ios/strings; .claude/skills/enable-admob).
        # Google's SKAdNetwork list (developers.google.com/admob/ios/3p-skadnetworks).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
