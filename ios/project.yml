    entitlements:
      path: Bottlepost/Bottlepost.entitlements
      properties:
        # App Check (App Attest). Needs the App Attest capability on the App ID (docs/IOS_RELEASE_GUIDE.md).
        com.apple.developer.devicecheck.appattest-environment: production
        # New-letter notifications (APNs key uploaded to Firebase Cloud Messaging).
        aps-environment: production
        # 18+ check with Apple's age range (iOS 26+); see Data/AgeGate.swift.
        com.apple.developer.declared-age-range: true
        # Sign in with Apple (account restore) and the private iCloud Drive container for the
        # encrypted backup (Data/CloudBackup.swift). Container: docs/IOS_RELEASE_GUIDE.md "M6".
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.bottlepost.app]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.bottlepost.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bottlepost.app
        PRODUCT_NAME: Bottlepost
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
  BottlepostTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BottlepostTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bottlepost
schemes:
  Bottlepost:
    build:
      targets:
        Bottlepost: all
        BottlepostTests: [test]
    test:
      config: Debug
      targets: [BottlepostTests]
    archive:
      config: Release
